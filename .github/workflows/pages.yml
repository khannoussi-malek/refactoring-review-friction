name: Deploy docs/ to GitHub Pages

on:
  push:
    branches: [version2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # a slow deployment must be allowed to finish, not be killed by the next push
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Kept in the repository as part of the record, but not published:
      # the draft is marked "DRAFT. NOT SENT."; the specs restate a withdrawn
      # finding as established and describe the tooling §VIII-B draws a line about.
      - run: |
          rm -f docs/DRAFT_dataset_authors_query.md
          rm -rf docs/superpowers
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # ponytail: Pages deployments for this site take >10min and deploy-pages
      # clamps its wait to 10min, so the step always times out even though the
      # deployment lands. Don't fail the run on it; confirm with curl instead.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
